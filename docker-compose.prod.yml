# Shared defaults (#310 — beaconfolio is ONE TENANT on a multi-project host).
#
# LOGGING: the json-file driver is UNBOUNDED by default, so one chatty tenant
# fills the disk for every project on the box. 10 MB × 3 files caps each
# container at ~30 MB. Override host-wide with DOCKER_LOG_MAX_SIZE /
# DOCKER_LOG_MAX_FILE, or set the same defaults daemon-wide in
# /etc/docker/daemon.json (see docs/wiki/production-deployment.md § Log rotation).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    logging: *default-logging
    # Ceiling, not a reservation: an unbounded container can OOM-kill a
    # NEIGHBOURING project, which is a cross-project outage, not a beaconfolio bug.
    mem_limit: ${DB_MEM_LIMIT:-2g}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-beaconfolio}
      PGPORT: ${POSTGRES_PORT:-5433}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      # LOOPBACK BY DEFAULT (#310, security change). Before this, the database
      # was published on every host interface — and `ufw deny` does NOT protect
      # it: Docker publishes ports with a DNAT rule in PREROUTING and the packet
      # traverses FORWARD, so it never enters the INPUT chain ufw filters. A
      # 127.0.0.1 bind is the fix that does not depend on the firewall at all
      # (the kernel drops any off-host packet claiming 127.0.0.1 as destination).
      # Reach it from a workstation over an SSH tunnel, never by re-opening this.
      # Escape hatch, eyes open: POSTGRES_BIND_HOST=0.0.0.0.
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5433}:${POSTGRES_PORT:-5433}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-beaconfolio} -p ${POSTGRES_PORT:-5433}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  ollama:
    image: ollama/ollama:0.5.7
    restart: always
    logging: *default-logging
    # THE named hog (#310): model pulls + inference with OLLAMA_KEEP_ALIVE=-1
    # keep up to OLLAMA_MAX_LOADED_MODELS resident forever. MEASURED on a warm
    # stack: 4.195 GiB RSS with all three pinned models resident (llama3.2
    # 2.0 GB, llama3.2:1b 1.3 GB, nomic-embed-text 274 MB) — so this ceiling is
    # ~2x the observed working set and changes nothing for a healthy stack. It
    # only stops a runaway from taking the whole box (and its neighbours) with
    # it. Size it per host:
    # docs/wiki/production-deployment.md § Resource isolation.
    mem_limit: ${OLLAMA_MEM_LIMIT:-8g}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep nomic-embed-text && ollama list | grep llama3.2 && ollama list | grep 'llama3.2:1b' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 180
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        # Pull only if not already cached in the persistent ollama_data volume
        # (no re-download on restart; offline-safe once cached).
        ollama list | grep -q 'nomic-embed-text' || ollama pull nomic-embed-text
        ollama list | grep -q 'llama3.2:latest'  || ollama pull llama3.2
        ollama list | grep -q 'llama3.2:1b'       || ollama pull llama3.2:1b
        # Prewarm: load the generation models into memory so the first user
        # request is not a multi-second cold start (kept resident via KEEP_ALIVE).
        ollama run llama3.2 "warmup" >/dev/null 2>&1 || true
        ollama run llama3.2:1b "warmup" >/dev/null 2>&1 || true
        wait
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_KEEP_ALIVE=-1
    networks:
      - app-network

  backend:
    image: ${IMAGE_REPO:-ghcr.io/mavrovde/beaconfolio}-backend:${IMAGE_TAG:-1.16.0}
    restart: always
    logging: *default-logging
    mem_limit: ${BACKEND_MEM_LIMIT:-4g}
    volumes:
      # Persist the saved LinkedIn login session across deploys/restarts
      # (see LINKEDIN_COOKIES_DIR / app.services.linkedin.COOKIES_DIR).
      - linkedin_cookies:/data/linkedin_cookies
      # Whisper weights (#264) — same no-re-download-on-restart pattern the
      # ollama_data volume gives Ollama's models. Target must equal
      # WHISPER_MODEL_DIR (app/config.py).
      - whisper_models:/data/whisper
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-beaconfolio}
      - OLLAMA_URL=http://ollama:11434
      - GENERATION_MODEL=llama3.2
      - FAST_GENERATION_MODEL=llama3.2:1b
      - OTEL_SDK_DISABLED=true
      - CREWAI_TELEMETRY_OPT_OUT=true
      - BEACONFOLIO_GEMINI_API_KEY=${BEACONFOLIO_GEMINI_API_KEY}
      # Notification channels (#263): empty = channel off, exactly like SMTP.
      - BEACONFOLIO_TELEGRAM_BOT_TOKEN=${BEACONFOLIO_TELEGRAM_BOT_TOKEN:-}
      - BEACONFOLIO_TELEGRAM_CHAT_ID=${BEACONFOLIO_TELEGRAM_CHAT_ID:-}
      - BEACONFOLIO_NOTIFY_WEBHOOK_URL=${BEACONFOLIO_NOTIFY_WEBHOOK_URL:-}
      # Matrix + self-hosted SMS gateway (#431): same rule — all parts of a
      # channel's config must arrive, and empty means the channel is absent.
      - BEACONFOLIO_MATRIX_HOMESERVER=${BEACONFOLIO_MATRIX_HOMESERVER:-}
      - BEACONFOLIO_MATRIX_ACCESS_TOKEN=${BEACONFOLIO_MATRIX_ACCESS_TOKEN:-}
      - BEACONFOLIO_MATRIX_ROOM_ID=${BEACONFOLIO_MATRIX_ROOM_ID:-}
      - BEACONFOLIO_SMS_GATEWAY_URL=${BEACONFOLIO_SMS_GATEWAY_URL:-}
      - BEACONFOLIO_SMS_GATEWAY_USER=${BEACONFOLIO_SMS_GATEWAY_USER:-}
      - BEACONFOLIO_SMS_GATEWAY_PASSWORD=${BEACONFOLIO_SMS_GATEWAY_PASSWORD:-}
      - BEACONFOLIO_SMS_GATEWAY_TO=${BEACONFOLIO_SMS_GATEWAY_TO:-}
      - NOTIFY_TIMEOUT_SECONDS=${NOTIFY_TIMEOUT_SECONDS:-10}
      # Transparent translation (#248): same forwarding rule as dev — without
      # these the root .env knobs never reach the container.
      - TRANSLATION_ENABLED=${TRANSLATION_ENABLED:-true}
      - OWNER_LANGUAGE=${OWNER_LANGUAGE:-en}
      - ENGAGEMENT_ANALYTICS_ENABLED=${ENGAGEMENT_ANALYTICS_ENABLED:-true}
      - ENGAGEMENT_RETENTION_DAYS=${ENGAGEMENT_RETENTION_DAYS:-365}
      # Voice channel (#264): browser voice messages transcribed LOCALLY by
      # faster-whisper in this container. ON in the dev stack so the feature is
      # exercised end to end; OFF here, because enabling it is also what
      # authorizes the one-time Whisper model download onto the host.
      - VOICE_MESSAGES_ENABLED=${VOICE_MESSAGES_ENABLED:-false}
      - VOICE_MESSAGE_MAX_BYTES=${VOICE_MESSAGE_MAX_BYTES:-2097152}
      - VOICE_MESSAGE_MAX_DURATION_SECONDS=${VOICE_MESSAGE_MAX_DURATION_SECONDS:-90}
      - VOICE_RATE_LIMIT_REQUESTS=${VOICE_RATE_LIMIT_REQUESTS:-3}
      - VOICE_RATE_LIMIT_WINDOW_SECONDS=${VOICE_RATE_LIMIT_WINDOW_SECONDS:-60}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      # WHISPER_MODEL_DIR is deliberately NOT forwarded: it is the mount target
      # of the whisper_models volume below, and an owner pointing it at an
      # unmounted path would re-download the model on every container start
      # (same reasoning as LINKEDIN_COOKIES_DIR above).
      # Same value the proxy service gets below (#273): the backend believes
      # X-Real-IP / X-Forwarded-For only from these peers when keying its
      # per-client-IP rate limiters, so a spoofed header cannot mint a fresh
      # bucket. Default = the Docker bridge range, i.e. our nginx container.
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      # Analytics write budget + connection pool (#326): the emits have their
      # OWN pool of exactly ENGAGEMENT_MAX_CONCURRENT_WRITES connections, so a
      # side write can never take one a request is waiting for; DB_ECHO=false
      # keeps SQL logging off (it was hard-coded on).
      - ENGAGEMENT_MAX_CONCURRENT_WRITES=${ENGAGEMENT_MAX_CONCURRENT_WRITES:-4}
      - ENGAGEMENT_MAX_PENDING_EVENTS=${ENGAGEMENT_MAX_PENDING_EVENTS:-1000}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-40}
      - DB_ECHO=${DB_ECHO:-false}
      # Email (#262): pass-through from .env. Empty SMTP_HOST = sending
      # disabled (the graceful-skip contract). Without these lines the whole
      # DEPLOYMENT.md email section was inert on prod — the settings never
      # reached the app (measured in review: 35 env keys, none SMTP).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_FROM=${SMTP_FROM:-}
      # Names ONLY (never values) of pre-#141 variables still set on the host, so
      # the backend can warn that they are ignored (#141). A credential never
      # enters the container through this.
      - LEGACY_GEMINI_ENV=${GEMINI_API_KEY:+GEMINI_API_KEY }${GEMINI_ENCRYPTION_KEY:+GEMINI_ENCRYPTION_KEY }${GEMINI_MODEL:+GEMINI_MODEL }${GEMINI_MODEL_FALLBACK:+GEMINI_MODEL_FALLBACK} ${HIREFOLIO_GEMINI_API_KEY:+HIREFOLIO_GEMINI_API_KEY }${HIREFOLIO_GEMINI_ENCRYPTION_KEY:+HIREFOLIO_GEMINI_ENCRYPTION_KEY }${HIREFOLIO_GEMINI_MODEL:+HIREFOLIO_GEMINI_MODEL }${HIREFOLIO_GEMINI_MODEL_FALLBACK:+HIREFOLIO_GEMINI_MODEL_FALLBACK }${HIREFOLIO_ANALYTICS_ID:+HIREFOLIO_ANALYTICS_ID }${HIREFOLIO_NOTIFY_WEBHOOK_URL:+HIREFOLIO_NOTIFY_WEBHOOK_URL }${HIREFOLIO_TELEGRAM_BOT_TOKEN:+HIREFOLIO_TELEGRAM_BOT_TOKEN }${HIREFOLIO_TELEGRAM_CHAT_ID:+HIREFOLIO_TELEGRAM_CHAT_ID }  # de-brand:historical: retired names forwarded (names only) for the #330 startup diagnostic
      # SECURITY (issue #143): Fernet key encrypting the per-user Gemini API key
      # at rest. Set a strong value in the root .env; generate with
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Empty leaves values as plaintext (backward compatible; not recommended in prod).
      - BEACONFOLIO_GEMINI_ENCRYPTION_KEY=${BEACONFOLIO_GEMINI_ENCRYPTION_KEY:-}
      # SECURITY (issue #142): initial admin password. REQUIRED — the backend
      # refuses to seed a login-able default admin when this is empty, so prod
      # can never ship the historical admin/admin login. Set a strong value in
      # the root .env before deploying.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # SECURITY (issue #177): secret that signs/verifies admin JWTs. REQUIRED —
      # the backend refuses to start when this is empty (or still the historical
      # placeholder), so prod can never sign admin tokens with a publicly-known
      # key. Set a strong value in the root .env; generate with:
      #   openssl rand -hex 32
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      # Local/E2E escape hatch ONLY: with no JWT_SECRET_KEY, generate a random
      # per-process secret instead of failing (sessions do not survive a
      # restart). Off by default — never enable it on the prod host.
      - JWT_ALLOW_EPHEMERAL_SECRET=${JWT_ALLOW_EPHEMERAL_SECRET:-false}
      - LINKEDIN_EMAIL=${LINKEDIN_EMAIL:-}
      - LINKEDIN_PASSWORD=${LINKEDIN_PASSWORD:-}
      - LINKEDIN_PUBLIC_ID=${LINKEDIN_PUBLIC_ID:-}
      - LINKEDIN_IMPORT_TOKEN=${LINKEDIN_IMPORT_TOKEN:-}
      - IMPORT_MAX_IMAGE_MB=${IMPORT_MAX_IMAGE_MB:-10}
      # Operational tuning knobs (#207) — same pattern as IMPORT_MAX_IMAGE_MB:
      # forwarded explicitly, defaulting to the literals they replaced, so an
      # unchanged .env reproduces the previous behaviour inside the container.
      - LLM_REQUEST_TIMEOUT_SECONDS=${LLM_REQUEST_TIMEOUT_SECONDS:-300.0}
      - LLM_STREAM_TIMEOUT_SECONDS=${LLM_STREAM_TIMEOUT_SECONDS:-30.0}
      - EMBEDDING_REQUEST_TIMEOUT_SECONDS=${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-30.0}
      - OLLAMA_HEALTHCHECK_TIMEOUT_SECONDS=${OLLAMA_HEALTHCHECK_TIMEOUT_SECONDS:-2.0}
      - OLLAMA_PREFLIGHT_TIMEOUT_SECONDS=${OLLAMA_PREFLIGHT_TIMEOUT_SECONDS:-5.0}
      - OLLAMA_STARTUP_CHECK_TIMEOUT_SECONDS=${OLLAMA_STARTUP_CHECK_TIMEOUT_SECONDS:-10.0}
      - PROFILE_DATA_TIMEOUT_SECONDS=${PROFILE_DATA_TIMEOUT_SECONDS:-5.0}
      - DB_RESTORE_TIMEOUT_SECONDS=${DB_RESTORE_TIMEOUT_SECONDS:-300}
      - IMPORT_MAX_POSTS_JSON_MB=${IMPORT_MAX_POSTS_JSON_MB:-10}
      - IMPORT_MAX_POSTS_PER_REQUEST=${IMPORT_MAX_POSTS_PER_REQUEST:-500}
      - TAILORED_VISIT_RATE_LIMIT_REQUESTS=${TAILORED_VISIT_RATE_LIMIT_REQUESTS:-20}
      - TAILORED_VISIT_RATE_LIMIT_WINDOW_SECONDS=${TAILORED_VISIT_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Site identity (#65) — served to the public app via GET /config/site;
      # empty means "use the app default" (see config.py validator), so an
      # unset host variable never blanks the branding.
      - SITE_NAME=${SITE_NAME:-}
      - SITE_URL=${SITE_URL:-}
      # PUBLIC_URL is NOT a backend knob — it names the freshness/health-gate
      # probe target. Forwarded so startup can warn when it is set while
      # SITE_URL (the real identity knob) is not (#335).
      - PUBLIC_URL=${PUBLIC_URL:-}
      - OWNER_NAME=${OWNER_NAME:-}
      - OWNER_HEADLINE=${OWNER_HEADLINE:-}
      - OWNER_DESCRIPTION=${OWNER_DESCRIPTION:-}
      - SOCIAL_LINKS=${SOCIAL_LINKS:-}
      - BEACONFOLIO_ANALYTICS_ID=${BEACONFOLIO_ANALYTICS_ID:-}
      - BEACONFOLIO_GTM_CONTAINER_ID=${BEACONFOLIO_GTM_CONTAINER_ID:-}
      # Brand assets (#67) — favicon, header logo, social card and webfont.
      # All empty by default; empty means "use the bundled asset", so an unset
      # host variable never blanks the branding.
      - BEACONFOLIO_BRAND_FAVICON_URL=${BEACONFOLIO_BRAND_FAVICON_URL:-}
      - BEACONFOLIO_BRAND_LOGO_URL=${BEACONFOLIO_BRAND_LOGO_URL:-}
      - BEACONFOLIO_BRAND_OG_IMAGE_URL=${BEACONFOLIO_BRAND_OG_IMAGE_URL:-}
      - BEACONFOLIO_BRAND_FONT_CSS_URL=${BEACONFOLIO_BRAND_FONT_CSS_URL:-}
      - BEACONFOLIO_BRAND_FONT_FAMILY=${BEACONFOLIO_BRAND_FONT_FAMILY:-}
      # AI-crawler policy (#252): allow (default) | deny — rendered into the
      # SSR robots.txt via GET /config/site.
      - AI_CRAWLER_POLICY=${AI_CRAWLER_POLICY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: ${IMAGE_REPO:-ghcr.io/mavrovde/beaconfolio}-frontend:${IMAGE_TAG:-1.16.0}
    restart: always
    logging: *default-logging
    mem_limit: ${FRONTEND_MEM_LIMIT:-1g}
    expose:
      - "80"
      - "4000"
    environment:
      - NODE_ENV=production
      # Allow all hosts: node SSR sits behind two trusted nginx layers, and the
      # Host that reaches it is the internal service name (e.g. "frontend"), not
      # the public host. The reverse proxy already validates the public Host, so
      # host validation here would only break pre-rendered SSR. See server.ts.
      - NG_ALLOWED_HOSTS=*
    depends_on:
      - backend
    networks:
      - app-network

  admin-frontend:
    image: ${IMAGE_REPO:-ghcr.io/mavrovde/beaconfolio}-admin-frontend:${IMAGE_TAG:-1.16.0}
    restart: always
    logging: *default-logging
    mem_limit: ${ADMIN_FRONTEND_MEM_LIMIT:-512m}
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    # NO fixed container name (#310): that compose key is HOST-GLOBAL and
    # bypasses project scoping, so a second project on the same box running Open
    # WebUI collides on the literal name and one of the two refuses to start.
    # The compose-generated name (<project>-open-webui-1) is per-project, and
    # the SERVICE NAME stays a network alias either way — which is what
    # `proxy_pass http://open-webui:8080/` resolves (proxy/default.conf.template).
    restart: always
    logging: *default-logging
    mem_limit: ${OPEN_WEBUI_MEM_LIMIT:-2g}
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - app-network

  proxy:
    image: ${IMAGE_REPO:-ghcr.io/mavrovde/beaconfolio}-proxy:${IMAGE_TAG:-1.16.0}
    # NO fixed container name (#310): `global_proxy` claimed a host-GLOBAL
    # identity by name on a box beaconfolio does not own. Resolve it via
    # `docker compose -f docker-compose.prod.yml ps -q proxy` instead of a
    # literal name (deploy.yml's proxy smoke check now does exactly that).
    restart: always
    logging: *default-logging
    mem_limit: ${PROXY_MEM_LIMIT:-512m}
    environment:
      # Owner-configurable proxy identity (see .env.example). Defaults preserve
      # the canonical beaconfolio.com behavior; a forker overrides these in the root .env.
      - PUBLIC_SERVER_NAME=${PUBLIC_SERVER_NAME:-beaconfolio.com www.beaconfolio.com}
      - ADMIN_SERVER_NAME=${ADMIN_SERVER_NAME:-admin.beaconfolio.com admin.localhost}
      # Admin console hardening (#86). Admin ships CLOSED to the public: with an
      # empty ADMIN_ALLOWED_CIDRS only loopback reaches it. Set trusted operator
      # IPs/CIDRs to open it — but ONLY effective with real_ip trusting your front
      # proxy (TRUSTED_PROXY_CIDRS) so $remote_addr is the real client, not the
      # Docker gateway. Never set ADMIN_ALLOWED_CIDRS=0.0.0.0/0 in production.
      - ADMIN_ALLOWED_CIDRS=${ADMIN_ALLOWED_CIDRS:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      - REAL_IP_HEADER=${REAL_IP_HEADER:-X-Forwarded-For}
    ports:
      # PUBLISHED BINDINGS as ONE variable each (#310). beaconfolio must be able to
      # stop claiming host-global 80 on a shared box WITHOUT editing this file:
      # the rollout job runs a hardcoded `docker compose -f docker-compose.prod.yml`
      # (.github/workflows/deploy.yml), so a per-host override file would never
      # be loaded — but the host `.env` IS read, on every rollout.
      #
      # Defaults are byte-identical to the pre-#310 values, so CI, the Docker E2E
      # and the WireMock integration tier are untouched. On a SHARED-EDGE host the
      # owner sets, in the host .env (this is the cutover step, not a code change):
      #   PROXY_HTTP_PUBLISH=127.0.0.1:18080:80
      #   PROXY_HTTPS_PUBLISH=127.0.0.1:18443:443
      # …and the host edge (Caddy) terminates TLS on 80/443 and proxies to those.
      # See docs/wiki/production-deployment.md § Multi-project host architecture
      # and § Host port registry.
      - "${PROXY_HTTP_PUBLISH:-80:80}"
      - "${PROXY_HTTPS_PUBLISH:-10443:443}"
    depends_on:
      - frontend
      - admin-frontend
      - backend
      - open-webui
    networks:
      - app-network

  # OPTIONAL self-hosted outbound relay (#262) — OFF by default; enable with
  # `docker compose --profile mail up`. When enabled, set SMTP_HOST=mailer,
  # SMTP_PORT=587, SMTP_STARTTLS=false in .env (the relay is reached over the
  # private compose network only; it is NOT exposed on the host).
  # Deliverability is the owner's problem to solve, not this file's to promise:
  # see docs/DEPLOYMENT.md "Self-hosted outbound mail" for the SPF/DKIM/rDNS
  # requirements and the port-25 egress reality on most VPS providers. Most
  # owners should point SMTP_* at an external provider instead.
  mailer:
    image: boky/postfix:v4.2.0
    profiles: ["mail"]
    logging: *default-logging
    mem_limit: ${MAILER_MEM_LIMIT:-256m}
    # No restart policy ON PURPOSE: with an empty MAIL_SENDER_DOMAIN postfix
    # exits at startup, and unless-stopped would crash-loop it silently
    # forever (#296 round 2). Fail once, visibly.
    environment:
      # Empty => postfix refuses to start, which is the honest failure: the
      # profile without a sender domain cannot deliver anything anyway.
      - ALLOWED_SENDER_DOMAINS=${MAIL_SENDER_DOMAIN:-}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  open-webui_data:
  linkedin_cookies:
  whisper_models:
