services:
  backend:
    build: ./backend
    environment:
      # E2E ONLY: the ephemeral test stack has no JWT_SECRET_KEY (and must never
      # be given a real one — see rule 10), so let the backend generate a random
      # per-process signing secret instead of refusing to start (issue #177).
      # Production ships with this OFF and REQUIRES an explicit JWT_SECRET_KEY.
      - JWT_ALLOW_EPHEMERAL_SECRET=true
      # E2E ONLY, rule 10 (#141): force the Gemini key EMPTY so the stack falls
      # back to the in-stack Ollama and no billable request can be made. CI
      # already injects "" at the job level, but a LOCAL `verify_all.sh` run
      # inherits the root .env through compose — so a developer holding a real
      # key was running the E2E stack with a live paid credential. Setting it
      # here protects every path that uses this overlay, not just the one that
      # remembers to export it.
      - BEACONFOLIO_GEMINI_API_KEY=
      # E2E ONLY (#337): the CPU-only test stack cold-loads the generation
      # model on its first request, and first-token latency can exceed prod's
      # 30s per-read stream budget — the backend then substitutes degraded
      # text and the unmocked NDJSON contract spec red-flags it. 120s absorbs
      # a cold load; prod keeps the tight default.
      - LLM_STREAM_TIMEOUT_SECONDS=120.0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  admin-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin

  proxy:
    build: ./proxy
    environment:
      # E2E ONLY: the admin E2E hits admin.localhost through the Docker bridge, so
      # nginx sees the gateway as $remote_addr and no X-Forwarded-For is set (real_ip
      # can't recover a real client). Open the allowlist for the test run only.
      # Production ships CLOSED (empty ADMIN_ALLOWED_CIDRS -> loopback only).
      - ADMIN_ALLOWED_CIDRS=0.0.0.0/0

  ollama:
    environment:
      # E2E ONLY (#337): keep loaded models resident for the whole suite —
      # the default 5m keep_alive lets the generation model unload between
      # the early specs and the late NDJSON contract spec, re-paying the
      # cold load exactly when the budget is tightest.
      - OLLAMA_KEEP_ALIVE=1h
