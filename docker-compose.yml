# Shared defaults (#310). LOGGING ONLY here, deliberately: the json-file driver
# is unbounded, and an all-day dev stack fills a laptop disk exactly like it
# fills a server one. Memory CEILINGS live in docker-compose.prod.yml only —
# their rationale is "do not OOM a NEIGHBOURING project on a shared host", which
# a developer machine does not have, and a too-tight ceiling here would only
# break local runs. Override with DOCKER_LOG_MAX_SIZE / DOCKER_LOG_MAX_FILE.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-3}"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-beaconfolio}
      PGPORT: ${POSTGRES_PORT:-5433}
    ports:
      - "${POSTGRES_PORT:-5433}:${POSTGRES_PORT:-5433}"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-beaconfolio} -p ${POSTGRES_PORT:-5433}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    restart: always
    logging: *default-logging
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep nomic-embed-text && ollama list | grep llama3.2 && ollama list | grep 'llama3.2:1b' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 180
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        # Pull only if not already cached in the persistent ollama_data volume
        # (no re-download on restart; offline-safe once cached).
        ollama list | grep -q 'nomic-embed-text' || ollama pull nomic-embed-text
        ollama list | grep -q 'llama3.2:latest'  || ollama pull llama3.2
        ollama list | grep -q 'llama3.2:1b'       || ollama pull llama3.2:1b
        # Prewarm: load the generation models into memory so the first user
        # request is not a multi-second cold start (kept resident via KEEP_ALIVE).
        ollama run llama3.2 "warmup" >/dev/null 2>&1 || true
        ollama run llama3.2:1b "warmup" >/dev/null 2>&1 || true
        wait
    environment:
      - OLLAMA_NUM_PARALLEL=16
      - OLLAMA_MAX_LOADED_MODELS=4
      - OLLAMA_KEEP_ALIVE=-1
    networks:
      - app-network

  backend:
    image: ${IMAGE_REPO:-mavrovde}-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: always
    logging: *default-logging
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./scraper:/scraper
      # Persist the saved LinkedIn login session across container recreates
      # (see LINKEDIN_COOKIES_DIR / app.services.linkedin.COOKIES_DIR).
      - linkedin_cookies:/data/linkedin_cookies
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:${POSTGRES_PORT:-5433}/${POSTGRES_DB:-beaconfolio}
      - OLLAMA_URL=http://ollama:11434
      - GENERATION_MODEL=llama3.2
      - FAST_GENERATION_MODEL=llama3.2:1b
      - OTEL_SDK_DISABLED=true
      - CREWAI_TELEMETRY_OPT_OUT=true
      - BEACONFOLIO_GEMINI_API_KEY=${BEACONFOLIO_GEMINI_API_KEY}
      # Notification channels (#263): empty = channel off, exactly like SMTP.
      - BEACONFOLIO_TELEGRAM_BOT_TOKEN=${BEACONFOLIO_TELEGRAM_BOT_TOKEN:-}
      - BEACONFOLIO_TELEGRAM_CHAT_ID=${BEACONFOLIO_TELEGRAM_CHAT_ID:-}
      - BEACONFOLIO_NOTIFY_WEBHOOK_URL=${BEACONFOLIO_NOTIFY_WEBHOOK_URL:-}
      - NOTIFY_TIMEOUT_SECONDS=${NOTIFY_TIMEOUT_SECONDS:-10}
      # Transparent translation (#248): without these forwards the knobs in
      # the root .env are INERT — config.py's env_file resolves inside the
      # container (the ADMIN_PASSWORD/LINKEDIN_IMPORT_TOKEN lesson below).
      - TRANSLATION_ENABLED=${TRANSLATION_ENABLED:-true}
      - OWNER_LANGUAGE=${OWNER_LANGUAGE:-en}
      - ENGAGEMENT_ANALYTICS_ENABLED=${ENGAGEMENT_ANALYTICS_ENABLED:-true}
      - ENGAGEMENT_RETENTION_DAYS=${ENGAGEMENT_RETENTION_DAYS:-365}
      # Same value the proxy service gets below (#273): the backend believes
      # X-Real-IP / X-Forwarded-For only from these peers when keying its
      # per-client-IP rate limiters, so a spoofed header cannot mint a fresh
      # bucket. Default = the Docker bridge range, i.e. our nginx container.
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      # Analytics write budget + connection pool (#326): the emits have their
      # OWN pool of exactly ENGAGEMENT_MAX_CONCURRENT_WRITES connections, so a
      # side write can never take one a request is waiting for; DB_ECHO=false
      # keeps SQL logging off (it was hard-coded on).
      - ENGAGEMENT_MAX_CONCURRENT_WRITES=${ENGAGEMENT_MAX_CONCURRENT_WRITES:-4}
      - ENGAGEMENT_MAX_PENDING_EVENTS=${ENGAGEMENT_MAX_PENDING_EVENTS:-1000}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-40}
      - DB_ECHO=${DB_ECHO:-false}
      # Email (#262): the dev stack defaults to the bundled Mailpit catch-all —
      # every notification is visible at http://localhost:8025 with ZERO
      # config, and nothing ever leaves the machine (rule 10). Point SMTP_* at
      # a real provider to override — and then ALSO set SMTP_STARTTLS=true:
      # the false default below belongs to the plaintext local relay only.
      # Empty SMTP_HOST disables sending.
      - SMTP_HOST=${SMTP_HOST-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - SMTP_FROM=${SMTP_FROM:-beaconfolio@localhost}
      # Names ONLY (never values) of pre-#141 variables still set on the host, so
      # the backend can warn that they are ignored (#141). A credential never
      # enters the container through this.
      - LEGACY_GEMINI_ENV=${GEMINI_API_KEY:+GEMINI_API_KEY }${GEMINI_ENCRYPTION_KEY:+GEMINI_ENCRYPTION_KEY }${GEMINI_MODEL:+GEMINI_MODEL }${GEMINI_MODEL_FALLBACK:+GEMINI_MODEL_FALLBACK} ${HIREFOLIO_GEMINI_API_KEY:+HIREFOLIO_GEMINI_API_KEY }${HIREFOLIO_GEMINI_ENCRYPTION_KEY:+HIREFOLIO_GEMINI_ENCRYPTION_KEY }${HIREFOLIO_GEMINI_MODEL:+HIREFOLIO_GEMINI_MODEL }${HIREFOLIO_GEMINI_MODEL_FALLBACK:+HIREFOLIO_GEMINI_MODEL_FALLBACK }${HIREFOLIO_ANALYTICS_ID:+HIREFOLIO_ANALYTICS_ID }${HIREFOLIO_NOTIFY_WEBHOOK_URL:+HIREFOLIO_NOTIFY_WEBHOOK_URL }${HIREFOLIO_TELEGRAM_BOT_TOKEN:+HIREFOLIO_TELEGRAM_BOT_TOKEN }${HIREFOLIO_TELEGRAM_CHAT_ID:+HIREFOLIO_TELEGRAM_CHAT_ID }  # de-brand:historical: retired names forwarded (names only) for the #330 startup diagnostic
      # SECURITY (issue #143): Fernet key that encrypts the per-user Gemini API
      # key at rest. Optional locally (empty = plaintext passthrough).
      - BEACONFOLIO_GEMINI_ENCRYPTION_KEY=${BEACONFOLIO_GEMINI_ENCRYPTION_KEY:-}
      # SECURITY (issue #177): admin JWTs are signed with JWT_SECRET_KEY, which
      # has no default any more (prod refuses to start without it). The local
      # dev stack opts into a random per-process secret instead of committing a
      # shared key — set JWT_SECRET_KEY in the root .env if you want logins to
      # survive a backend restart.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ALLOW_EPHEMERAL_SECRET=${JWT_ALLOW_EPHEMERAL_SECRET:-true}
      # Without this line the setup.sh-generated admin password never reached
      # the container (only the PROD compose forwarded it) — the backend then
      # took the #142 refuse-to-seed branch while the wizard printed login
      # credentials that could not work (#256 review blocker 1).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Machine token for the LinkedIn importer — prod compose has passed this
      # since the import endpoints shipped; the dev stack never did, so a token
      # configured in .env silently 401'd locally (#228). Empty default = token
      # auth disabled, admin-session imports only (same semantics as prod).
      - LINKEDIN_IMPORT_TOKEN=${LINKEDIN_IMPORT_TOKEN:-}
      # README:408 documents IMPORT_MAX_IMAGE_MB as a backend knob and the PROD
      # compose has always forwarded it (docker-compose.prod.yml:116) — the dev
      # stack never did, so the same .env behaved differently on the two stacks.
      # Found by scripts/check_compose_env.sh (v1.13.0 retrospective); default
      # equals config.py's, so nothing changes for anyone who sets nothing.
      - IMPORT_MAX_IMAGE_MB=${IMPORT_MAX_IMAGE_MB:-10}
      # Operational tuning knobs (#207) — same pattern as IMPORT_MAX_IMAGE_MB:
      # forwarded explicitly, defaulting to the literals they replaced, so an
      # unchanged .env reproduces the previous behaviour inside the container.
      - LLM_REQUEST_TIMEOUT_SECONDS=${LLM_REQUEST_TIMEOUT_SECONDS:-300.0}
      - LLM_STREAM_TIMEOUT_SECONDS=${LLM_STREAM_TIMEOUT_SECONDS:-30.0}
      - EMBEDDING_REQUEST_TIMEOUT_SECONDS=${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-30.0}
      - OLLAMA_HEALTHCHECK_TIMEOUT_SECONDS=${OLLAMA_HEALTHCHECK_TIMEOUT_SECONDS:-2.0}
      - OLLAMA_PREFLIGHT_TIMEOUT_SECONDS=${OLLAMA_PREFLIGHT_TIMEOUT_SECONDS:-5.0}
      - OLLAMA_STARTUP_CHECK_TIMEOUT_SECONDS=${OLLAMA_STARTUP_CHECK_TIMEOUT_SECONDS:-10.0}
      - PROFILE_DATA_TIMEOUT_SECONDS=${PROFILE_DATA_TIMEOUT_SECONDS:-5.0}
      - DB_RESTORE_TIMEOUT_SECONDS=${DB_RESTORE_TIMEOUT_SECONDS:-300}
      - IMPORT_MAX_POSTS_JSON_MB=${IMPORT_MAX_POSTS_JSON_MB:-10}
      - IMPORT_MAX_POSTS_PER_REQUEST=${IMPORT_MAX_POSTS_PER_REQUEST:-500}
      - TAILORED_VISIT_RATE_LIMIT_REQUESTS=${TAILORED_VISIT_RATE_LIMIT_REQUESTS:-20}
      - TAILORED_VISIT_RATE_LIMIT_WINDOW_SECONDS=${TAILORED_VISIT_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Site identity (#65) — served to the public app via GET /config/site;
      # defaults live in app/config.py, the root .env overrides them.
      - SITE_NAME=${SITE_NAME:-}
      - SITE_URL=${SITE_URL:-}
      # PUBLIC_URL is NOT a backend knob — it names the freshness/health-gate
      # probe target. Forwarded so startup can warn when it is set while
      # SITE_URL (the real identity knob) is not (#335).
      - PUBLIC_URL=${PUBLIC_URL:-}
      - OWNER_NAME=${OWNER_NAME:-}
      - OWNER_HEADLINE=${OWNER_HEADLINE:-}
      - OWNER_DESCRIPTION=${OWNER_DESCRIPTION:-}
      - SOCIAL_LINKS=${SOCIAL_LINKS:-}
      - BEACONFOLIO_ANALYTICS_ID=${BEACONFOLIO_ANALYTICS_ID:-}
      # AI-crawler policy (#252): allow (default) | deny — rendered into the
      # SSR robots.txt via GET /config/site.
      - AI_CRAWLER_POLICY=${AI_CRAWLER_POLICY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - app-network

  # Catch-all SMTP + web inbox for DEV (#262): captures every outbound mail,
  # delivers nothing externally. UI: http://localhost:8025. The prod compose
  # deliberately has no such service — see the `mail` profile there.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8025:8025"   # web UI + REST API (the integration tier asserts via it)
    networks:
      - app-network

  frontend:
    image: ${IMAGE_REPO:-mavrovde}-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    logging: *default-logging
    expose:
      - "80"
      - "4000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

  admin-frontend:
    image: ${IMAGE_REPO:-mavrovde}-admin-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin
    restart: always
    logging: *default-logging
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - app-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    # NO fixed container name (#310) — host-global, bypasses project scoping.
    # The service name remains a network alias, which is what nginx resolves.
    restart: always
    logging: *default-logging
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - app-network

  proxy:
    build: ./proxy
    image: ${IMAGE_REPO:-mavrovde}-proxy:${IMAGE_TAG:-latest}
    # NO fixed container name (#310) — resolve it with
    # `docker compose ps -q proxy` instead of the literal `global_proxy`.
    restart: always
    logging: *default-logging
    environment:
      # Owner-configurable proxy identity (see .env.example). Defaults preserve
      # the canonical beaconfolio.com behavior; a forker overrides these in the root .env.
      - PUBLIC_SERVER_NAME=${PUBLIC_SERVER_NAME:-beaconfolio.com www.beaconfolio.com}
      - ADMIN_SERVER_NAME=${ADMIN_SERVER_NAME:-admin.beaconfolio.com admin.localhost}
      # Admin console hardening (#86). Closed by default (loopback only); set
      # trusted operator CIDRs to open. See docker-compose.prod.yml for details.
      - ADMIN_ALLOWED_CIDRS=${ADMIN_ALLOWED_CIDRS:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      - REAL_IP_HEADER=${REAL_IP_HEADER:-X-Forwarded-For}
    ports:
      - "4200:80"
      - "443:443"
    depends_on:
      - frontend
      - admin-frontend
      - backend
      - open-webui
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  open-webui_data:
  linkedin_cookies:
