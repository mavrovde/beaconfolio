# SonarQube/SonarCloud project configuration (#359).
# Shared by CI (.github/workflows/sonarqube.yml) and the local check
# (scripts/sonar_local.sh) so both analyze the identical surface.

sonar.projectKey=mavrovde_beaconfolio
sonar.projectName=Beaconfolio
sonar.sourceEncoding=UTF-8

# Both stacks + the operational shell/importer code.
sonar.sources=backend/app,frontend/projects,importer,scripts
sonar.tests=backend/tests,backend/tests_integration
# Frontend unit/E2E specs live inside frontend/projects — classify them as tests.
sonar.test.inclusions=frontend/projects/**/*.spec.ts

# Keep analysis fast (<~5 min) and free of generated/vendored noise.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,frontend/coverage/**,**/*.min.js
# Shell tooling and E2E harness code carry no coverage instrumentation.
sonar.coverage.exclusions=scripts/**,importer/**,frontend/projects/**/e2e/**,frontend/projects/*-e2e/**

sonar.python.version=3.12
# backend: pytest --cov-report=xml → backend/coverage.xml (sonar_local.sh reminds you)
sonar.python.coverage.reportPaths=backend/coverage.xml
# frontend: npm run test:coverage → frontend/coverage/<project>/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/public/lcov.info,frontend/coverage/admin/lcov.info,frontend/coverage/shared/lcov.info
