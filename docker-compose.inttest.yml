# Integration-test overlay (#260): the black-box tier's stack shape.
#
#   docker compose -f docker-compose.yml -f docker-compose.inttest.yml up -d
#   (or just ./run_integration_tests.sh)
#
# The `ollama` service IS WireMock here: same hostname, same port (11434), so
# the backend's OLLAMA_URL needs no change and the real model server never
# boots — AI code paths are exercised against deterministic, credential-free
# stubs (rule 10 by construction). Mappings live in
# backend/tests_integration/wiremock/mappings/ and double as documentation of
# what we expect the Ollama API to return; the __fault__ mappings inject
# delays/errors so the #207 timeout/fallback behavior is integration-tested.
services:
  ollama:
    image: wiremock/wiremock:3.10.0
    entrypoint: ["/docker-entrypoint.sh", "--port", "11434", "--disable-banner", "--global-response-templating"]
    # Neutralize the base service's `command:` (ollama serve args) — compose
    # merge would otherwise append it to WireMock's argv (#261 review).
    command: []
    volumes:
      - ./backend/tests_integration/wiremock:/home/wiremock:ro
    networks:
      app-network:
        # nginx's rendered config names an `open-webui` upstream and refuses to
        # START if the hostname doesn't resolve (measured: `host not found in
        # upstream` emerg). open-webui itself is multi-GB and unused by this
        # tier, so the WireMock container answers to that name too — the proxy
        # boots, and nothing in the suite talks to /webui.
        aliases:
          - open-webui
    healthcheck:
      # Replaces the model-presence check — WireMock is healthy when its admin
      # API answers.
      test: ["CMD-SHELL", "curl -s -f http://localhost:11434/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  db:
    # Verification stacks must NOT evict the developer's test database. Prod
    # compose publishes 5433 — the same port the local pytest DB uses — so every
    # integration/E2E stack booted from this overlay stole it and the next
    # `pytest`/pre-push run died with "password authentication failed" against
    # the wrong Postgres. Nothing inside the stack uses the host port (services
    # reach `db:5433` over the compose network), so remapping the HOST side is
    # free. Override POSTGRES_HOST_PORT if 5533 is taken too.
    ports: !override
      - "${POSTGRES_HOST_PORT:-5533}:${POSTGRES_PORT:-5433}"

  # Catch-all inbox for the tier (#262): the email assertion runs against
  # THIS, never a real relay. Present in the overlay — not only the dev base —
  # because CI layers this overlay over docker-compose.prod.yml, which has no
  # mailpit (review #296 round 1: the tier was green locally on the dev base
  # and would have reddened main on the prod base).
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - app-network

  backend:
    # The black-box tier needs the backend ORIGIN directly (root banner, API
    # semantics) as well as the proxy path — prod compose publishes only :80,
    # so expose :8000 here (#261 review blocker 1).
    ports:
      - "8000:8000"
    environment:
      # PINNED, not inherited (#296 review, rule 10): a maintainer with real
      # provider credentials in .env must never have the tier deliver through
      # a paid relay. Same defense the e2e overlay applies to the Gemini key.
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_STARTTLS=false
      - SMTP_FROM=beaconfolio-inttest@localhost
      # Same rule-10 posture as the E2E overlay: no signing secret to leak,
      # no paid key that could make a billable call.
      - JWT_ALLOW_EPHEMERAL_SECRET=true
      - BEACONFOLIO_GEMINI_API_KEY=
      # Voice channel (#264). PINNED on, because CI layers this overlay over
      # docker-compose.prod.yml where the flag defaults OFF — inherited, the
      # tier would silently test a 404 instead of the intake path.
      - VOICE_MESSAGES_ENABLED=true
      # ...and pinned BROKEN, deliberately. Transcribing for real would pull
      # ~150 MB of Whisper weights from Hugging Face on every CI run, which is
      # the same class of mistake as a test reaching a paid API (rule 10's
      # rationale, even though nothing here is billable). A name that is
      # neither a known size nor a `repo/id` fails in faster-whisper's own
      # validation BEFORE any network call — measured:
      # `ValueError: Invalid model size 'inttest-no-such-model', expected one
      # of: tiny.en, tiny, base.en, ...`. HF_HUB_OFFLINE=1 is the backstop, so
      # even a future code path that resolved a repo id cannot reach the
      # network from this tier. What the tier then asserts is the contract that
      # matters at this layer and cannot be faked in a unit test: a failing
      # transcriber never breaks intake — the row lands and the audio stays
      # playable (issue #264's verify step 3).
      - WHISPER_MODEL=inttest-no-such-model
      - HF_HUB_OFFLINE=1
