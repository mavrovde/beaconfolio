<div class="login-container">
  <div class="terminal-window">
    <div class="terminal-header">
      <span class="terminal-title">{{ title$ | async }}</span>
    </div>
    <div class="terminal-body">
      <h2 class="login-title">&gt; Admin Login</h2>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="username">&gt; Username:</label>
          <input type="text" id="username" name="username" [(ngModel)]="username" required autocomplete="username"
            [disabled]="loading" />
        </div>

        <div class="form-group">
          <label for="password">&gt; Password:</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" required
            autocomplete="current-password" [disabled]="loading" />
        </div>

        @if (errorMessage) {
        <div class="error-message"><span class="error-icon">✗</span> {{ errorMessage }}</div>
        }

        <div class="button-group">
          <button type="submit" [disabled]="!loginForm.valid || loading" class="btn-primary">
            {{ loading ? '[ Authenticating... ]' : '[ Login ]' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
