# Pre-installs project dependencies for the GitHub Copilot coding agent's ephemeral
# environment, so it can run the repo's gates (pytest/ruff/mypy, vitest/build) without
# spending its session on setup. The job MUST be named `copilot-setup-steps`.
# Docs: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    # Copilot only needs to read the repo contents to set up; keep the token minimal.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12 (matches prod/CI)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: ./backend
        # patch_linkedin.sh is mandatory before any backend install: the pinned
        # linkedin-api sdist (pin in requirements.txt) has an invalid entry point that aborts pip.
        # Every install leg in deploy.yml and backend/Dockerfile does the same.
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt

      - name: Set up Node 22 (matches CI)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
