# Bandit security scan — runs the repo's OWN Bandit contract and publishes SARIF.
#
# Replaces the stock template (#355), which had three problems:
#   1. it scanned everything at every severity and flooded the Security tab with
#      100 findings — 98× B101 (`assert` in tests), a rule-10 dummy fixture
#      token, and one deliberate local-probe `verify=False`;
#   2. it drove the scan through `shundor/python-bandit-scan`, an unmaintained
#      third-party action pinned to a 2022 commit — the source of the
#      "Node 20 is being deprecated" warning, and an unnecessary supply-chain
#      dependency for what is one `bandit` invocation;
#   3. its SARIF carried no category, so uploads from different tools can
#      overwrite each other's results in the Security tab.
#
# This version runs Bandit directly with the contract from CLAUDE.md
# (`bandit -ll --skip B101`), over the backend app AND the operational Python the
# backend-local command never sees: `backend/scripts/` (password reset, key
# backfill, db probe, seeders), `backend/ensure_admin.py`, the `importer/`
# package, and the root proxy probe. NOTE the paths are chosen by MEASUREMENT,
# not by intuition — `scraper/` and the root `scripts/` contain ZERO Python
# (they are Node and bash), while `backend/scripts/` holds 12 Python files and
# carried two genuine MEDIUM findings that an earlier path list missed. And
# uploads SARIF under an explicit `category: bandit` so it coexists with the
# Snyk and CodeQL uploads.
#
# Findings are release-triage input (rule 8): the scan reports, it does not
# break the build. A deep per-finding audit + a committed Bandit profile is
# tracked separately in #363.

name: Bandit
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '20 22 * * 6'

permissions:
  contents: read

jobs:
  bandit:
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'   # the version prod/CI runs
      - name: Install Bandit (with the SARIF formatter)
        run: pip install --quiet "bandit[sarif]"
      - name: "Run Bandit (repo contract: -ll --skip B101)"
        # -ll = MEDIUM severity and above; B101 (assert_used) is skipped because
        # the test suites are built on `assert`. `|| true` keeps the scan
        # report-only; the SARIF below is the deliverable.
        run: |
          bandit -r backend/app backend/scripts backend/ensure_admin.py importer \
            verify_proxy_routes.py \
            -ll --skip B101 -f sarif -o bandit.sarif -q || true
      - name: Verify the SARIF is present and well-formed
        id: sarif
        # A malformed or missing SARIF must not be uploaded — a failed upload
        # reads as a broken pipeline when the real signal is "the scan produced
        # nothing". Validate before handing it to the uploader.
        run: |
          if python -c "import json,sys; d=json.load(open('bandit.sarif')); sys.exit(0 if d.get('runs') else 1)" 2>/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            python -c "import json; d=json.load(open('bandit.sarif')); print(f\"::notice::Bandit SARIF OK — {len(d['runs'][0]['results'])} finding(s)\")"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bandit produced no valid SARIF — skipping upload"
          fi
      - name: Upload SARIF to code scanning
        if: steps.sarif.outputs.ok == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          # Distinct category: without it, a second tool's upload can displace
          # these results in the Security tab.
          category: bandit
