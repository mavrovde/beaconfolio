# Snyk Security — code (SAST), open-source deps, and IaC for THIS repository.
# Adapted from GitHub's stock template (PR #354) by #358: the template's
# placeholder container step moved to snyk-container.yml (PR #356), and every
# step now targets the repo's real manifests. SNYK_TOKEN is an Actions secret
# (scan quota only — rule 10: it never enters test/E2E stacks).
name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '17 4 * * 5'   # weekly, before the Friday container scan

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write   # SARIF upload
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail fast without a token
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "::error::SNYK_TOKEN is not set — the scan cannot run. Add the repo secret."; exit 1
          fi
      - uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
      # Snyk needs resolvable dependency trees for SCA: install both stacks' manifests.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install frontend lockfile (metadata only)
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install backend requirements (resolution only)
        working-directory: backend
        # The venv lives OUTSIDE the checkout, in $RUNNER_TEMP. Measured reason:
        # when it sat at `backend/.snyk-venv`, Snyk Code walked into it and
        # reported **79 of 100 findings inside `pip/_vendor/…`** — third-party
        # package sources nobody here can act on, burying the 21 findings that
        # were actually ours. Dependencies are judged by SCA (which reads the
        # manifests directly), never by code analysis of their vendored source.
        # Keeping the venv out of the tree fixes that at the source; `.snyk`
        # additionally excludes the other vendored/generated trees.
        #
        # Best-effort install: linkedin-api==2.2.1 is a prod-patched wheel not on
        # PyPI (CLAUDE.md rule 6), so a clean-index install cannot fully resolve
        # — and it must never hard-fail the scan job.
        run: |
          python -m venv "$RUNNER_TEMP/snyk-venv" && . "$RUNNER_TEMP/snyk-venv/bin/activate"
          pip install -q -r requirements.txt -r requirements-dev.txt \
            || pip install -q -r requirements.txt \
            || echo "::warning::partial dependency resolution (patched wheel absent) — Snyk reads the manifest directly"
      - name: Snyk Code (SAST) → SARIF
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}" }
        # A rejected token (HTTP 403 — Snyk Code not enabled for the org, or an
        # invalid/wrong-region SNYK_TOKEN) leaves no valid SARIF. Surface it as an
        # actionable error but don't crash the step; the guarded upload below skips
        # a missing/empty file so the run reflects "token needs fixing", not a
        # broken workflow. (Findings, when the token works, land in the Security
        # tab for rule-8 triage.)
        run: |
          # `snyk code test` exits 1 when it FINDS something — a successful scan,
          # not an error. Judge the SARIF, not the exit code: anything else prints
          # a "no SARIF" warning on the exact runs that found the most.
          snyk code test --sarif > snyk-code.sarif || true
          if ! python3 -c "import json,sys; d=json.load(open('snyk-code.sarif')); sys.exit(0 if d.get('runs') else 1)" 2>/dev/null; then
            echo "::warning::snyk code test produced no valid SARIF — check SNYK_TOKEN and that Snyk Code (sastEnabled) is ON for the org; a disabled org answers HTTP 403"
          fi
      - name: Snyk Open Source (both stacks)
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}" }
        run: |
          snyk test --file=frontend/package-lock.json --package-manager=npm --severity-threshold=high || true
          . "$RUNNER_TEMP/snyk-venv/bin/activate" && snyk test --file=backend/requirements.txt --command=python --severity-threshold=high || true
          snyk monitor --all-projects || true
      - name: Snyk IaC (compose + Dockerfiles + workflows)
        env: { SNYK_TOKEN: "${{ secrets.SNYK_TOKEN }}" }
        run: snyk iac test --report || true
      - name: Check SARIF is present and non-empty
        id: sarif
        run: |
          # Parse it, don't grep it: a truncated or error-JSON file can still
          # contain the text "runs" while being unuploadable.
          if python3 -c "import json,sys; d=json.load(open('snyk-code.sarif')); sys.exit(0 if d.get('runs') else 1)" 2>/dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            python3 -c "import json; d=json.load(open('snyk-code.sarif')); print(f\"::notice::Snyk Code SARIF OK — {sum(len(r.get('results',[])) for r in d['runs'])} finding(s)\")"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no valid Snyk SARIF to upload — skipping (see the Snyk Code step)"
          fi
      - name: Upload SARIF to code scanning
        if: steps.sarif.outputs.ok == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          # Distinct category per tool: without it, whichever upload runs last
          # displaces the others' results in the Security tab.
          category: snyk-code
