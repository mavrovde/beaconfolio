# Verdict Audit (#392, v1.14.1 retrospective change B) — goes RED whenever a PR
# merged after the cutover carries no canonical review verdict (rule 13).
#
# Same alarm shape as Live Freshness: a scheduled workflow that is red while the
# invariant is broken, because a red workflow gets looked at and a log line does
# not. The invariant: every merged PR carries a posted body whose FIRST
# NON-EMPTY LINE states APPROVE or REQUEST CHANGES (the repository's canonical
# verdict definition, docs/retrospectives/README.md).
#
# Why detection and not prevention: #321 (Dependabot) and #355 (the security-tab
# "set up this workflow" flow) both merged in the GitHub WEB UI, where the
# pre-merge-gate PreToolUse hook does not exist, and merge provenance is
# unmeasurable here (owner and agents share one identity). The CLI half is
# guarded by the hook — whose PR_MERGE_GATE=0 bypass now leaves a log line and a
# PR comment — so this workflow owns the half no hook can reach.
#
# SINCE is pinned to the control's landing date so the two historical
# no-verdict merges (#321, #355 — already documented in the v1.14.1
# retrospective) do not keep the alarm permanently red. Moving it BACKWARD is a
# decision for a retro, not a quick fix for a red run — and so is moving it
# FORWARD, which would amnesty a red run instead of fixing it (#399 review).
#
# #409 makes the detector ORDER-AWARE, which turned this window from "clean"
# into seven real violations that cannot be repaired — a verdict back-filled
# after a merge is a record, not a gate. They are named one by one in
# scripts/verdict-audit-acknowledged.txt rather than amnestied by moving SINCE,
# precisely so a NEW violation in the SAME window still turns this red. The
# ledger is a list of what escaped; it should shrink over time, never grow.
#
# "Mechanism established" means established FROM THE FLOW SHAPE (a Dependabot
# PR and a security-tab PR, neither of which passes through this CLI), not
# from provenance, which stays unmeasurable — the two statements coexist.
name: Verdict Audit

on:
  schedule:
    - cron: "17 6 * * *"   # DAILY 06:17 UTC (#409 — weekly meant up to 7 days of
                           # detection latency, and v1.14.2 opened and closed its
                           # six violations inside a single cron interval)
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Self-test the auditor first (a broken detector must not report clean)
        run: bash scripts/audit_no_verdict_merges.test.sh --mutations
      # --limit is a TRUNCATION GUARD, not a page size: the script exits 2
      # ("cannot measure") the moment the window fills it, rather than silently
      # auditing a prefix. SINCE never moves forward, so the window only grows —
      # measured 2026-09-18: 39 merged PRs since the cutover (23 of them on the
      # 14th itself; ~4/day since), so 100 would have tripped inside a fortnight
      # and turned this alarm into a maintenance nag. 400 is ~3 months of
      # headroom at that rate. When it binds again, do NOT just raise the number:
      # the real ceiling is the GraphQL budget — the script spends one
      # `gh pr view` per in-window PR and GITHUB_TOKEN allows ~1000/hour — so the
      # fix at that point is to bound the window, with the ledger carrying the
      # history the bound would drop.
      - name: Every merged PR since the cutover was GATED by a pre-merge verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/audit_no_verdict_merges.sh --since 2026-09-14T00:00:00Z --limit 400
