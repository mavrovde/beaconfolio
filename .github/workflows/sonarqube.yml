# SonarQube / SonarCloud analysis — secrets-gated (#359, adapts stock PR #357).
#
# The analysis job runs ONLY when both SONAR_TOKEN and SONAR_HOST_URL secrets are
# configured — absent secrets produce a clean skip with a one-line note, never a red
# run (the same pattern as deploy.yml's "Check rollout secrets" job, #112/#169).
#
# Decision (recorded in #359): the recommended CI target is **SonarCloud**
# (free for public repos, PR decoration included) rather than a self-hosted
# SonarQube, which needs Developer Edition ≥9.7 for PR decoration. To activate:
#   - SonarCloud: SONAR_HOST_URL=https://sonarcloud.io, SONAR_TOKEN from the
#     SonarCloud account, and add `-Dsonar.organization=<org>` to the args below.
#   - Self-hosted: point SONAR_HOST_URL at the instance.
# Project config (key, sources, coverage paths) lives in sonar-project.properties.
# The same analysis runs locally without any secrets via scripts/sonar_local.sh.

name: SonarQube analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:
  check-secrets:
    name: Check Sonar secrets
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Decide whether analysis can run
        id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN / SONAR_HOST_URL not configured — skipping analysis." \
                 "Run the local check instead: bash scripts/sonar_local.sh (#359)."
          fi

  analysis:
    name: Analysis
    needs: check-secrets
    if: needs.check-secrets.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # The scanner reads the coverage reports named in sonar-project.properties
    # (backend/coverage.xml, frontend/coverage/*/lcov.info). Until #407 this job
    # ran WITHOUT producing them, so the quality gate read `new_coverage = 0.0`
    # and was structurally RED on every PR — a normalised red (the #372 shape).
    # The tests therefore run HERE, before the scan, same commands as deploy.yml's
    # test jobs. That duplicates the suites in a second workflow by design: this
    # one runs in parallel with deploy.yml on runner minutes, not on the push
    # budget, and a coverage-blind Sonar gate measures nothing.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_beaconfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so new-code detection and blame are accurate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          bash scripts/patch_linkedin.sh
          pip install -r requirements-dev.txt
      - name: Backend coverage (pytest → backend/coverage.xml)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_beaconfolio
          SECRET_KEY: test-secret-key-for-ci
          OLLAMA_BASE_URL: http://localhost:11434
          # Rule 10: explicit empty credential — no paid service is reachable.
          BEACONFOLIO_GEMINI_API_KEY: ""
        run: pytest -n auto --tb=short --cov=app --cov-report=xml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm i --legacy-peer-deps
      - name: Frontend coverage (Vitest ×3 → frontend/coverage/*/lcov.info)
        # run_frontend_suites.sh = the signature-narrow retry for the upstream
        # Vitest worker-teardown race (#319, #309), same as deploy.yml.
        run: bash scripts/run_frontend_suites.sh --coverage

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        # Project key/sources/exclusions come from the committed
        # sonar-project.properties; add -Dsonar.organization=<org> here when
        # targeting SonarCloud.
