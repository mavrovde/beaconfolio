# Live-freshness gate (#169): is the LIVE site running what we RELEASED?
#
# The deploy pipeline's own "Health + freshness gate" only runs when the
# secrets-gated rollout actually rolled the host. When the DEPLOY_* secrets are
# absent the run stays green while prod silently ages — that is exactly how
# beaconfolio.com sat on v1.2.27 for five months while every release was announced as
# shipped. This workflow is the independent check: it runs on a schedule and on
# demand, needs no secrets, and FAILS RED whenever live ≠ released.
#
# Red here does not block deploys (it is a separate workflow, not a deploy.yml
# job) — it is the standing alarm that "green pipeline" has drifted from "live
# site". Silence it by rolling the host forward, never by editing the check.
# The verdict logic itself lives in scripts/check_live_freshness.sh — ONE
# contract shared with deploy.yml's post-rollout gate, so the two probes can
# never drift apart.
#
# NOTE: GitHub auto-disables scheduled workflows after ~60 days without repo
# activity — if this repo goes quiet, re-enable it (Actions → Live Freshness)
# or run it manually; a silent alarm is the failure mode it exists to prevent.
name: Live Freshness

on:
  schedule:
    # Daily, 06:23 UTC — off the full hour to dodge the scheduled-run thundering
    # herd, at most one day of undetected staleness.
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live-freshness:
    name: Live vs Released
    # Forks: without their own PUBLIC_URL variable this would probe the
    # canonical deployment against the fork's VERSION — permanently red and
    # unsolicited traffic. Run only on the canonical repo or when the fork has
    # configured its own URL.
    if: github.repository == 'mavrovde/beaconfolio' || vars.PUBLIC_URL != ''
    runs-on: ubuntu-latest
    env:
      # A forker points this at their own site via a repository variable; the
      # canonical repo defaults to the maintainer's deployment.
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://beaconfolio.com' }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare live version + route shape against the released VERSION
        run: |
          set -u
          released=$(cat VERSION)
          # GH steps run bash -e: capture rc explicitly or a red verdict would
          # kill the step before the summary is written.
          rc=0
          out=$(bash scripts/check_live_freshness.sh "$PUBLIC_URL" "$released") || rc=$?
          echo "$out"

          {
            echo "## Live freshness — $PUBLIC_URL (released: $released)"
            echo ""
            echo "| Probe | Observed | Verdict |"
            echo "|---|---|---|"
            echo "$out" | while read -r probe observed verdict; do
              echo "| $probe | \`$observed\` | $verdict |"
            done
            case "$rc" in
              0) echo ""; echo "✅ Live matches the release." ;;
              1) echo ""; echo "❌ **Live is STALE.** The last green pipeline did not reach the host (rollout skipped or failed — #112/#156). Roll the host forward (docs/DEPLOYMENT.md) or configure the \`DEPLOY_*\` secrets. Do not silence this check any other way." ;;
              *) echo ""; echo "🚨 **Site unreachable** — this is an OUTAGE signal, not staleness." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -eq 1 ]; then
            echo "::error title=Live is STALE::live ≠ released $released — see the step summary."
          elif [ "$rc" -ne 0 ]; then
            echo "::error title=Site unreachable::$PUBLIC_URL did not answer — outage, not staleness."
          fi
          exit "$rc"

      # Certificate expiry alarm (#310) — must fire BEFORE the lapse, which the
      # freshness probe above cannot do: it detects a site that is ALREADY
      # broken. Let's Encrypt stopped sending expiration emails on 2025-06-04,
      # and Caddy's self-renewal failing (ACME outage, port 80 stolen, account
      # problem) is exactly the silent state this red run makes loud. Runs even
      # when the freshness step failed — staleness and expiry alarm
      # independently. 21 days = Caddy renews at ~1/3 of a 90-day lifetime
      # remaining (30d), so an alarm at 21d means renewal has already been
      # failing for ~9 days.
      - name: Certificate expiry (alarms before lapse)
        if: always()
        env:
          # A forker overrides with their own hostnames via a repo variable.
          # The maintainer's three are the default ONLY on the canonical repo:
          # on a fork they would probe someone else's certificates and print a
          # vacuous green while monitoring none of the fork's own (#413 review,
          # major 2). A fork without TLS_HOSTNAMES falls back to the hostname
          # of its PUBLIC_URL below — the same variable the job gate documents.
          TLS_HOSTNAMES: ${{ vars.TLS_HOSTNAMES || (github.repository == 'mavrovde/beaconfolio' && 'beaconfolio.com www.beaconfolio.com admin.beaconfolio.com' || '') }}
          MIN_DAYS: 21
        run: |
          set -u
          if [ -z "$TLS_HOSTNAMES" ]; then
            TLS_HOSTNAMES="$(printf '%s' "$PUBLIC_URL" | sed -E 's#^https?://##; s#[/:].*##')"
            echo "TLS_HOSTNAMES unset — derived from PUBLIC_URL: $TLS_HOSTNAMES"
          fi
          rc=0
          {
            echo "## Certificate expiry (minimum ${MIN_DAYS}d)"
            echo ""
            echo "| Hostname | notAfter | Days left | Verdict |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          now=$(date +%s)
          for host in $TLS_HOSTNAMES; do
            # timeout: an unreachable host must fail THIS hostname's row, not
            # hang the step until the job timeout. The empty-$end guard below
            # is what actually catches a failed probe — GH steps run bash -e
            # WITHOUT pipefail, so the pipeline's exit status is cut's (0).
            end=$(echo | timeout 15 openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null \
                  | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -z "$end" ]; then
              echo "| $host | (no certificate readable) | — | 🚨 unreachable |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=TLS probe failed::$host presented no readable certificate."
              rc=1
              continue
            fi
            endsec=$(date -d "$end" +%s)
            days=$(( (endsec - now) / 86400 ))
            if [ "$days" -lt "$MIN_DAYS" ]; then
              echo "| $host | $end | $days | ❌ **renew NOW** |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Certificate expiring::$host has $days days left (< $MIN_DAYS) — Caddy's renewal is failing; see the wiki's certificate-renewal section."
              rc=1
            else
              echo "| $host | $end | $days | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$rc"
