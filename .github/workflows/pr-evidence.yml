name: PR Stack Evidence

# #380: `deploy.yml` runs the Docker E2E and the WireMock integration tier on
# push-to-`main` ONLY, so a pull request could never carry in-CI evidence for
# either — rule 12's "validated on every applicable layer" depended on someone
# running them by hand and pasting numbers into the PR (forgettable,
# misreportable, unauditable — #365 lost a round to it, #373 shipped an
# assertion that had run nowhere).
#
# The decision (recorded here per the issue's AC4, weighed against the four
# options in #380):
#   - The WireMock INTEGRATION tier runs AUTOMATICALLY on every PR that can
#     break the composed stack (option 2). It is the cheap tier — no browsers,
#     no Ollama model, deterministic stubs — and it covers the composed API/AI
#     paths where the measured incidents lived.
#   - The full browser E2E runs ON DEMAND via the `run-e2e` PR label
#     (option 3). It is the expensive tier (4 image builds + full prod
#     topology + Playwright), so a reviewer summons it on the PRs whose failure
#     mode needs a browser rather than every PR paying for it. Local runs
#     remain valid evidence where the label isn't used. **It lives in its own
#     file, `pr-evidence-e2e.yml`, since #433** — see that file's header for
#     the measured reason (in short: `types:` cannot filter by label NAME, so
#     sharing a file made every unrelated label cancel, and then mask, this
#     tier's evidence).
#   - Docs-only PRs pay NOTHING: the `paths:` filter below means this workflow
#     does not even start for them (AC2).
#   - Option 1 (unconditional E2E on path-touching PRs) was rejected on cost:
#     measured on this PR's own runs, the E2E job took 7m35s-9m19s per run
#     while the integration tier took 2m05s-3m00s, and every PR synchronize
#     would pay the E2E price; the integration tier buys most of the
#     composed-path coverage for roughly a third of it.
#
# NOT a branch-protection candidate as-is: the `paths:` filter means docs-only
# PRs never start this workflow, so naively requiring its checks would leave
# such PRs waiting forever on a status that never reports. Promote it only
# with a paths-aware required-check strategy.
#
# Cost mitigation: image builds read `cache-from: type=gha` — the SAME layer
# cache `deploy.yml`'s push builds populate with mode=max — so a PR that
# doesn't touch a Dockerfile's inputs mostly restores layers. PR jobs
# deliberately do NOT write cache-to: PR-scoped caches would churn the shared
# 10 GB quota that the main-branch cache lives in.
#
# Security posture is identical to the push-side jobs (rule 10): empty paid
# key, ephemeral JWT signing, nothing read from `secrets.*` except nothing at
# all — this workflow never logs into a registry and never pushes an image.

on:
  pull_request:
    branches: [main]
    # NO `labeled` here (#433): this tier is automatic, so it has no reason to
    # start on a label — and because `types:` cannot filter by label NAME,
    # including it meant EVERY unrelated label created a run of this workflow,
    # which cancelled the real evidence and then posted a `skipped` check-run
    # over it. The `run-e2e` summon lives in `pr-evidence-e2e.yml` instead.
    types: [opened, synchronize, reopened]
    paths:
      - "backend/**"
      - "frontend/**"
      - "proxy/**"
      - "docker-compose*.yml"
      - ".github/workflows/pr-evidence.yml"

# A newer push to the same PR obsoletes the running evidence — cancel it
# (unlike deploy.yml's queue-don't-cancel, nothing here publishes). This is
# safe to leave unconditional ONLY because `labeled` is no longer a trigger
# above: `concurrency` is evaluated BEFORE a job's `if`, so while label events
# could start this workflow, each one cancelled the in-flight evidence and
# then skipped itself. Measured from the API at PR #433's pre-fix head
# `f55a7e8c`: **5 runs — 2 cancelled + 3 skipped**, one of the skipped ones
# having sat QUEUED 11m15s (created 15:49:12Z, started 16:00:27Z) before it
# skipped. That PR did nothing unusual — it was created with
# `gh pr create --label`, which is exactly what the issue-tracking flow
# mandates ("labels AT CREATION") — so every correctly-labelled PR lost the
# integration tier that #380 promised it. Now only a push can supersede a run.
concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
  # Local-only tag: images are built with `load: true` and never pushed, so
  # compose (pull_policy "missing") uses the loaded images and pulls nothing
  # under this name.
  IMAGE_TAG: pr-${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  integration-evidence:
    # ONE static name, and it now means exactly one thing (#433 review round 1,
    # finding 4). It previously did not: a run started by an unrelated label
    # posted a `skipped` check-run under THIS name, so `gh pr checks` read
    # `PR Integration Evidence (WireMock Stack): skipping` while the real,
    # PASSING run sat invisible in the run history — measured on #433 at head
    # `a4063df9`, two `skipped` check-runs (16:15:30Z, 16:15:34Z) posted after
    # the `success` one (16:02:12Z) and masked it. A reviewer reading the check
    # list concludes the tier never ran, the exact inverse of what #380 built
    # this workflow to prove.
    # A trigger-dependent `name:` expression was tried FIRST and rejected on
    # measurement: GitHub does not evaluate the expression for a SKIPPED job,
    # so the check-run was published with the raw `${{ ... }}` text as its
    # name. Dropping the `labeled` trigger (see `on:` above) is the fix that
    # actually works — no run, no check-run, no mask.
    # There is deliberately no job-level `if` any more: nothing but a push can
    # start this workflow, so there is no event left to guard against.
    name: PR Integration Evidence (WireMock Stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Prune pre-run (free space)
        run: docker system prune -a -f --volumes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Four builds, loaded into the local daemon, never pushed. cache-from
      # reads the main-branch layer cache; no cache-to (see header).
      - name: Build backend image (local)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
      - name: Build public frontend image (local)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
      - name: Build admin frontend image (local)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.admin
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
      - name: Build proxy image (local)
        uses: docker/build-push-action@v7
        with:
          context: ./proxy
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-proxy:${{ env.IMAGE_TAG }}
          cache-from: type=gha

      # From here the steps mirror deploy.yml's integration-tests job — same
      # overlay, same env posture, same gating split (#260/#261).
      - name: Start stack (prod topology, ollama = WireMock)
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: beaconfolio
          IMAGE_REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Rule 10: empty paid key + ephemeral signing key, nothing from
          # secrets. WireMock replacing Ollama makes a billable call
          # structurally impossible here.
          BEACONFOLIO_GEMINI_API_KEY: ""
          JWT_ALLOW_EPHEMERAL_SECRET: "true"
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.inttest.yml up -d --no-deps db ollama mailpit backend frontend admin-frontend proxy

      - name: Wait for real readiness
        run: |
          count=0
          until curl -s -f http://localhost/api/app/health >/dev/null; do
            count=$((count + 1))
            if [ "$count" -ge 60 ]; then
              echo "Backend never became healthy"; docker compose -f docker-compose.prod.yml -f docker-compose.inttest.yml logs --tail 80 backend ollama; exit 1
            fi
            sleep 3
          done
          echo "Backend healthy through the proxy."
          # Same proxy-root smoke the push-side job runs: the health path can
          # be green while the SSR root 502s.
          curl -s -f -o /dev/null http://localhost/ && echo "Proxy serves the public root."

      - name: Seed the integration admin user
        run: docker compose -f docker-compose.prod.yml -f docker-compose.inttest.yml exec -T backend python scripts/seed_e2e_user.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the black-box integration suite
        working-directory: backend/tests_integration
        env:
          BACKEND_URL: http://localhost:8000
          PUBLIC_URL: http://localhost
        run: |
          pip install --quiet pytest httpx
          # Gating run: deterministic composition cases only — wall-clock
          # fault budgets don't gate on shared-runner timing (#261).
          python -m pytest . -q -m "not faults"

      - name: Fault-injection timing cases (reported, non-gating)
        continue-on-error: true
        working-directory: backend/tests_integration
        env:
          BACKEND_URL: http://localhost:8000
          PUBLIC_URL: http://localhost
        run: python -m pytest . -q -m faults

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.inttest.yml logs --tail 120 backend ollama proxy
